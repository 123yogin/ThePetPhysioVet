{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}ThePetPhysioVet{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'vet.css' %}">
</head>
<body>
    {% if messages %}
    <div class="flash-stack">
        {% for message in messages %}
            <div class="alert {% if message.tags == 'error' %}alert-danger{% elif message.tags == 'success' %}alert-success{% else %}alert-info{% endif %}">{{ message }}</div>
        {% endfor %}
    </div>
    {% endif %}
    <div class="app-shell">
        <aside class="sidebar">
            <div class="sidebar-brand">ThePetPhysioVet</div>
            <a class="nav-item {% if request.resolver_match.url_name == 'dashboard' %}active{% endif %}" href="{% url 'dashboard' %}">
                <span class="icon">&#128197;</span> Dashboard
            </a>
            <a class="nav-item {% if request.resolver_match.url_name == 'patient_list' or request.resolver_match.url_name == 'patient_create' %}active{% endif %}" href="{% url 'patient_list' %}">
                <span class="icon">&#128054;</span> Patients
            </a>
            <a class="nav-item {% if request.resolver_match.url_name == 'create_appointment' %}active{% endif %}" href="{% url 'create_appointment' %}">
                <span class="icon">&#10133;</span> Create appointment
            </a>
            <a class="nav-item {% if request.resolver_match.url_name == 'appointment_list' %}active{% endif %}" href="{% url 'appointment_list' %}">
                <span class="icon">&#128203;</span> View appointments
            </a>
            <div class="sidebar-spacer"></div>
            <a class="nav-item" href="{% url 'logout' %}">
                <span class="icon">&#8594;</span> Logout
            </a>
        </aside>
        <main class="main-panel">
            {% block content %}{% endblock %}
        </main>
    </div>
    <button type="button" class="sidebar-toggle" aria-label="Toggle menu">&#9776;</button>
    <script src="{% static 'app.js' %}"></script>
</body>
</html>
