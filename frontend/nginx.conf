# Docker's embedded DNS (used to resolve the `backend` / other compose
# service names on the bridge network) at request time rather than once at
# nginx startup, so a backend container restart (new IP) doesn't require an
# nginx reload.
resolver 127.0.0.11 valid=10s ipv6=off;

# Deploy topology is a two-layer proxy: the platform's edge proxy (e.g.
# Coolify's Traefik, terminating TLS) -> this nginx -> gunicorn. Traefik
# already sets `X-Forwarded-Proto: https` on the inbound request; naively
# doing `proxy_set_header X-Forwarded-Proto $scheme;` below would *overwrite*
# that with `http` (this container only ever speaks plain HTTP on its own
# listen port), which breaks Django's `SECURE_PROXY_SSL_HEADER` check
# (settings.py) even after that's configured correctly. Preserve whatever
# the client/upstream proxy already sent; only fall back to this container's
# own scheme if nothing was sent at all (e.g. a direct, proxy-less request).
map $http_x_forwarded_proto $fwd_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Proxy API calls straight through to the backend service, keeping the
    # SPA same-origin with the API (mirrors the Vite dev proxy in
    # frontend/vite.config.ts) so production needs no CORS configuration.
    location /api/ {
        set $backend_upstream backend:8000;
        proxy_pass http://$backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
    }

    # Uploaded diagnostic reports / query attachments, served directly from
    # the shared `media_data` volume (mounted read-only here, read-write on
    # the backend) rather than proxied through the Python process — Django
    # deliberately does not serve /media at all in production (see
    # backend/petphysio/urls.py's `_media_serve`, which is only wired up
    # `if settings.DEBUG`). This is where that responsibility now lives.
    #
    # `Content-Disposition: attachment` forces a download instead of an
    # inline render, closing the gap QA flagged (API_CONTRACT.md §3
    # amendment 5): a file that slipped past the upload-time content-sniff
    # check, or a browser ignoring `X-Content-Type-Options: nosniff`, still
    # can't execute as HTML/SVG in the media origin's browsing context.
    location /media/ {
        alias /media/;
        add_header Content-Disposition "attachment" always;
        add_header X-Content-Type-Options "nosniff" always;
        autoindex off;
    }

    # SPA client-side routing: any request that isn't a real static asset —
    # e.g. a deep link like /invoices/1 hit directly or via browser
    # refresh — falls back to index.html so react-router can render it,
    # instead of nginx 404ing on a path with no matching file.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
